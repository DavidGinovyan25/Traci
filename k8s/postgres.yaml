apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traci-claim
  namespace: traci
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: traci-postgres
  namespace: traci
spec:
  serviceName: traci-postgres
  replicas: 1
  selector:
    matchLabels:
      app: traci-postgres
  template:
    metadata:
      labels:
        app: traci-postgres
    spec:
      containers:
      - name: traci-postgres
        image: postgres:17-alpine
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: my-configmap
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: my-configmap
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: traci-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: traci-claim

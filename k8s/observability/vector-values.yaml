role: Agent

customConfig:
  data_dir: /vector-data-dir

  api:
    enabled: true
    address: 0.0.0.0:8686

  sources:
    kubernetes_logs:
      type: kubernetes_logs

  sinks:
    vlogs:
      type: http
      inputs:
        - kubernetes_logs
      uri: "http://vls-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/jsonline?_msg_field=message"
      compression: gzip
      encoding:
        codec: json
      framing:
        method: newline_delimited
      healthcheck:
        enabled: false
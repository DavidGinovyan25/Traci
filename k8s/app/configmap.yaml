---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-configmap
  namespace: traci
data:
  POSTGRES_DB: "traci"
  POSTGRES_USER: "traci"
  DATA_SOURCE_URI: "localhost:5432/traci?sslmode=disable"
  DATA_SOURCE_USER: "postgres_exporter"
  HTTP_ADDR: ":8080"
  HTTP_PORT: "8080"
  SHUTDOWN_TIMEOUT: "10s"
  STOP_GRACE_PERIOD: "15s"
  CONNECT_TIMEOUT: "5s"
  TOKEN_TTL: "1h"
...
